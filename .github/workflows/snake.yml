name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:  
          github_user_name: ShivangiAhuja
          outputs:
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=ff00ff&color_dots=#1e1e1e,#ffb6c1,#ff69b4,#ff1493,#ff00ff4

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
