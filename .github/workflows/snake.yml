name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: ShivangiAhuja
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=f8a5c2&color_dots=#f2f2f2,#ffe6f2,#ffb6d9,#ff8fc1,#ff6eb4
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
